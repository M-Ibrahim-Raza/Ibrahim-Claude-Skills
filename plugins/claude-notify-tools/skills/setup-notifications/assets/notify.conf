# claude-notify configuration — read on every hook call, so edits apply instantly.
# Format: key=value, one per line. true/false for switches. Lines starting with # are ignored.
# Kill switch without editing this file: export CLAUDE_NOTIFY=0 before starting claude.

# Master switch
enabled=true

# ---- Channels ----
channel_desktop=true
channel_sound=true
channel_ntfy=false

# ---- Events ----
event_permission=true      # Notification: permission_prompt
event_question=true        # PreToolUse: AskUserQuestion
event_elicitation=true     # Notification: elicitation_dialog (MCP server needs input)
event_idle=true            # Notification: idle_prompt (waiting 60s+, a reminder)
event_stop=true            # Stop: Claude finished its turn
event_failure=true         # StopFailure: turn ended on an API error
event_session_end=false    # SessionEnd: session closed

# ---- Sound ----
# 0.0 - 1.0 (Windows, macOS, PipeWire/PulseAudio). aplay ignores volume.
sound_volume=0.6
# Optional custom files (absolute paths). Empty = bundled chimes in ./sounds
sound_done=
sound_needs_you=
sound_error=

# ---- ntfy (phone) ----
ntfy_server=https://ntfy.sh
# Prefer the env var CLAUDE_NOTIFY_NTFY_TOPIC so the topic isn't stored on disk.
ntfy_topic=
# Optional access token: env var CLAUDE_NOTIFY_NTFY_TOKEN (never put it here).

# ---- Noise filters ----
# Stop alerts on the channels below are sent only if the turn ran at least this long (0 = off).
min_turn_seconds=120
min_turn_channels=ntfy
# Skip desktop + sound when the terminal/IDE running Claude is the focused window.
skip_local_when_focused=true
# Drop an alert if this session already alerted within N seconds (0 = off).
dedupe_seconds=5
# Mute sound during these hours (local time, HH:MM-HH:MM, may wrap midnight). Empty = off.
quiet_hours=
# Send ntfy only for "you've been idle" and error alerts (desktop/sound still get everything).
ntfy_only_idle_and_errors=false
# Characters of Claude's last message to include in "done" alerts (0 = none).
summary_chars=150

# Write decisions to <temp>/claude-notify/notify.log
debug=false
